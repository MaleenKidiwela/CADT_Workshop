{# Usage: {% include 'partials/figure.html' with context %} after setting `f` and optional `figclass` #}
{% if f %}
<figure class="figure {{ figclass or '' }}">
  <button type="button" class="fig-btn" data-lightbox data-src="{{ f.file }}" data-alt="{{ f.alt }}" data-caption="{{ f.caption }}" data-credit="{{ f.credit }}" aria-label="Enlarge figure">
    <img src="{{ f.file }}" alt="{{ f.alt }}" loading="lazy">
  </button>
  <figcaption>{{ f.caption }} <span class="credit">{{ f.credit }}</span></figcaption>
</figure>
{% endif %}
