status: draft | confirmed | final
# Session type: plenary | talk | working | session | social | break
# leads: names that match team.yaml exactly become links.
#
# Source: draft agenda v2.3 (28 October 2026). Day 1 times, titles, and
# speakers follow John Delaney's Hypothesis comments of 14 November 2026,
# which also merged the Clear Seas and Maritime Blue slots, dropped the
# salmon and Internet of Things items, and moved ACLIM to 14:20. Francisco
# Werner's keynote (from the maintainer, 5 November 2026) keeps its 20
# minutes after the coffee break, so the rest of the morning runs 10 minutes
# later than in those comments. Names appear only where the agenda does not
# mark them as tentative. Held back until confirmed or reviewed: the Welcome
# to the land (tribal reviewer), the experimental Vltava interlude, and the
# Day 3 Esri talk (Kevin Butler).
# ---------------------------------------------------------------------------
status: draft
status_note: >-
  Draft program. Times, titles, and speakers may change.
timezone_label: All times Pacific Standard Time (UTC-8)
arc: >-
  Day 1 is open to all and sets out why Urban Seas matter, from hazards to the
  living sea. Day 2 builds a first specification of how the seven modules connect,
  and tests it against three worked cascades. Day 3 turns the specification into
  decisions: who holds the twin, what to build first, and who will carry it.

type_labels:
  plenary: ""   # empty: no tag shown
  talk: ""      # empty: no tag shown
  working: Working session
  session: Session
  social: Social
  break: Break

days:
  - id: day-1
    label: Day 1
    theme: Open to all
    date: 2026-12-15
    summary: >-
      Open to anyone who registers. Hazards come first, right after the opening
      keynote. The morning goes from why Urban Seas matter to the physical system
      of the Salish Sea. The afternoon covers ports, measurement, and the living
      sea, then turns to complex adaptive twins and gives the open audience a
      voice. Day 1 plenaries are recorded, with consent requested.
    sessions:
      - time: "08:00"
        end: "08:30"
        title: Registration, coffee, and pastries
        type: break
      - time: "08:30"
        end: "08:35"
        title: Welcome and introduction
        type: plenary
        speakers:
          # Speaker from the maintainer, 24 November 2026; title from UW News
          # (docs/SOURCES.md).
          - name: Joel Thornton
            about: Maggie Walker Dean, College of the Environment, University of Washington.
      - time: "08:35"
        end: "08:50"
        title: "Urban Sea Systems: what they are, where they are, and why they are important"
        type: plenary
        speakers:
          - name: H. Gary Greene
            about: >-
              President of the Circum-Pacific Council (CPC); founder and treasurer
              of GeoHab; technical advisor to the South Pacific Geoscience
              Commission (SOPAC); 29 years with the USGS, Distinguished Service;
              past director of Moss Landing Marine Laboratories; professor
              emeritus, San José State University.
      - time: "08:50"
        end: "09:05"
        title: "The Internet-connected Salish Sea: Highlights from the Canadian Salish Sea Workshop"
        type: plenary
        speakers:
          - name: Kate Moran
            about: >-
              Past President and CEO of ONC. Named an Officer of the Order of
              Canada on 11 May 2023. Former Assistant Director of the White House
              Office of Science and Technology Policy.
      - time: "09:05"
        end: "09:15"
        title: GeoHazards in an evolving world of novel sensors
        type: plenary
        speakers:
          - name: William Wilcock
            about: >-
              Jerome M. Paros Endowed Chair in Sensor Networks; inaugural director
              of the Paros Geohazards Center.
      - time: "09:15"
        end: "09:45"
        title: "Keynote: Urban Seas, digital twins, and the blue (and new blue) economy"
        type: plenary
        speakers:
          - name: Richard Spinrad
            about: >-
              11th Administrator of the National Oceanic and Atmospheric
              Administration; member of the National Academy of Engineering;
              formerly of the Office of Naval Research.
      - time: "09:45"
        end: "10:15"
        title: "Keynote: The Columbia Basin as precedent: fifty years of co-managed science at basin scale"
        type: plenary
        description: Preliminary title.
        speakers:
          - name: Zachary Penney
            about: Director of Strategic Initiatives, Columbia River Inter-Tribal Fish Commission (CRITFC).
          - name: Barry Thom
            about: Executive Director, Pacific States Marine Fisheries Commission (PSMFC).
      - time: "10:15"
        end: "10:40"
        title: Coffee break
        type: break
      - time: "10:40"
        end: "11:00"
        title: "Digital Twins (DTs) at the Land–Ocean Interface: connecting science, decisions, and public understanding"
        type: plenary
        description: >-
          Includes a report from the Digital Twin of the Ocean Summit in Yokohama,
          November 2026.
        speakers:
          - name: Francisco “Cisco” Werner
            about: Sant Chair in Marine Science, National Museum of Natural History.
      - time: "11:00"
        end: "11:25"
        title: Issues and challenges of the Salish Urban Sea System as a prototype for similar systems globally
        type: plenary
        speakers:
          - name: Kathryn Sobocinski
            about: >-
              Professor, Department of Environmental Sciences and Marine and
              Coastal Science, Western Washington University.
      - time: "11:25"
        end: "11:55"
        title: "Salish Sea and Columbia River Operational Forecast System: a digital twin for circulation, biogeochemical cycles, and toxics fate and transport"
        type: plenary
        speakers:
          # His own description (17 November 2026), not the agenda's.
          - name: Tarang Khangaonkar
            about: >-
              Director of the Salish Sea Modeling Center (SSMC) at the UW Center
              for Urban Waters, through a dual appointment with the Pacific
              Northwest National Laboratory (PNNL). At PNNL, Principal Program
              Manager specializing in Coastal Ocean Modeling.
      - time: "11:55"
        end: "12:20"
        title: Questions to the speakers
        type: plenary
      - time: "12:20"
        end: "13:10"
        title: Box lunches
        type: break
      - time: "13:15"
        end: "13:55"
        title: "The benefits and limitations of existing digital twins: ports, supply chains, and infrastructure"
        type: plenary
        description: Questions and answers with Kevin Butler.
        speakers:
          - name: Shiori Sasaki
            about: >-
              Professional engineer at Esri (Environmental Systems Research
              Institute), the geographic information system (GIS) software
              company. Shiori has worked on building and using digital twins in
