# registration as 08:00-08:35 and the welcome as 08:30; registration is
# shown ending at 08:30. Days 2 and 3: draft agenda v2.3 (28 October 2026).
# Names appear only where the agenda does not mark them as tentative. Held
# back until confirmed or reviewed: the Welcome to the land (tribal
# reviewer), the experimental Vltava interlude, and the Day 3 Esri talk.
