      - time: "13:55"
        end: "14:15"
        title: Clear Seas and the Blue Economy across our Salish Urban Sea System
        type: session
        description: Panel discussion.
        speakers:
          - {name: Paul Blomerus, about: "CEO of Clear Seas (Vancouver)."}
          - {name: Joshua Berger, about: "President and CEO of Maritime Blue (Seattle)."}
      - time: "14:15"
        end: "14:45"
        title: "Canadian–US ocean observations in the Salish Sea: the power of what we have, opportunities for what we need"
        type: session
        description: Current and future marine sensing systems for the Salish Sea.
        speakers:
          - {name: Jan Newton, about: "U.S. NANOOS."}
          - {name: Jordan Watson, about: "Ocean Networks Canada."}
      - time: "14:45"
        end: "15:10"
        title: "The modelers respond: what do you want over the next two decades?"
        type: session
        description: "Measurements: what, where, and how often? Moderator: Al Hermann."
      - time: "15:10"
        end: "15:45"
        title: Coffee break and discussion
        type: break
      - time: "15:45"
        end: "16:05"
        title: "A LEAP or a STEP: reflections on future digital twins of the ocean, inspired by a decade of integrated modeling in Alaska"
        type: plenary
        speakers:
          - name: Kirstin K. Holsman
            about: >-
              NOAA Alaska Fisheries Science Center. Co-author of the
              Intergovernmental Panel on Climate Change Sixth Assessment Report
