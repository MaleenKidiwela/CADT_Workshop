# ---------------------------------------------------------------------------
# Program. status: draft | confirmed | final
# Session type: plenary | talk | working | session | social | break
# leads: names that match team.yaml exactly become links.
#
# Source: draft agenda v2.3 (28 October 2026). Day 1 times, titles, and
# speakers follow John Delaney's Hypothesis comments of 14 November 2026,
# which also merged the Clear Seas and Maritime Blue slots, dropped the
# salmon and Internet of Things items, and moved ACLIM to 14:20. Francisco
# Werner's keynote (from the maintainer, 5 November 2026) keeps its 20
# minutes after the coffee break, so the rest of the morning runs 10 minutes
# later than in those comments. Names appear only where the agenda does not
# mark them as tentative. Held back until confirmed or reviewed: the Welcome
# to the land (tribal reviewer), the experimental Vltava interlude, and the
# Day 3 Esri talk (Kevin Butler).
# ---------------------------------------------------------------------------
status: draft
status_note: >-
  Draft program. Times, titles, and speakers may change.
timezone_label: All times Pacific Standard Time (UTC-8)
arc: >-
  Day 1 is open to all and sets out why Urban Seas matter, from hazards to the
  living sea. Day 2 builds a first specification of how the seven modules connect,
  and tests it against three worked cascades. Day 3 turns the specification into
  decisions: who holds the twin, what to build first, and who will carry it.

type_labels:
  plenary: Plenary
  talk: Talk
  working: Working session
  session: Session
  social: Social
  break: Break

days:
  - id: day-1
    label: Day 1
    theme: Open to all
    date: 2026-12-15
    summary: >-
      Open to anyone who registers. Hazards come first, right after the opening
      keynote. The morning goes from why Urban Seas matter to the physical system
      of the Salish Sea. The afternoon covers ports, measurement, and what
      modelers need, then turns to complex adaptive twins and gives the open
      audience a voice. Day 1 plenaries are recorded, with consent requested.
    sessions:
      - time: "08:00"
        title: Registration and coffee
        type: break
      - time: "08:35"
        title: "Urban Sea Systems around the world: the Southwest Pacific and the Baltic"
        type: talk
        leads: [H. Gary Greene]
      - time: "08:50"
        title: "University of Victoria and Ocean Networks Canada: commitments to Salish Sea documentation"
        type: talk
        leads: [Kate Moran]
      - time: "09:05"
        title: "Keynote: Urban Seas, digital twins, and the blue (and new blue) economy"
        type: plenary
        leads: [Richard Spinrad]
      - time: "09:35"
        title: The new UW Paros GeoHazards Program
        type: talk
        leads: [William Wilcock]
      - time: "09:50"
        title: "The Columbia Basin as precedent: fifty years of co-managed science at basin scale"
        type: plenary
        description: Keynote. Preliminary title.
        leads: [Zachary Penney, Barry Thom]
      - time: "10:20"
        title: Coffee break
        type: break
        description: 20 minutes.
      - time: "10:40"
        title: "Digital Twins (DTs) at the Land–Ocean Interface: connecting science, decisions, and public understanding"
        type: plenary
        description: >-
          Keynote, including a report from the DITTO Summit in Yokohama.
        leads: [Francisco Werner]
      - time: "11:00"
        title: Issues and challenges of the Salish Urban Sea System as a prototype for many similar systems globally
        type: talk
        leads: [Kathryn Sobocinski]
      - time: "11:25"
        title: "Panel: the physical system"
        type: session
        description: >-
          Weather in the Salish Sea and the Pacific Northwest (Cecilia Bitz).
          Watershed dynamics (Brad Butman). Salish Sea and Columbia River
          Operational Forecast System: a digital twin for circulation,
          biogeochemical cycles, and toxics fate and transport (Tarang
          Khangaonkar, joining by Zoom from Hawaii). The Fraser and the other
          rivers (Gwyn Lintern).
        leads: [John R. Delaney]
      - time: "11:55"
        title: Questions to the speakers
        type: session
      - time: "12:30"
        title: Box lunches
        type: break
        description: 40 minutes.
      - time: "13:15"
        title: Clear Seas and the Blue Economy across our Urban Sea System
        type: session
        description: >-
          Panel discussion with Paul Blomerus, CEO of Clear Seas, and Joshua
          Berger, President and CEO of Maritime Blue. 20 minutes.
        leads: [Paul Blomerus, Joshua Berger]
      - time: "13:40"
        title: "Canadian–US collaboration: measuring the Salish Sea System in real time"
        type: session
        description: >-
          What is in place now, and what could be done? Jan Newton of NANOOS and
          Jordan Watson of Ocean Networks Canada discuss marine sensing systems
          for the Salish Sea.
        leads: [Jan Newton, Jordan Watson]
      - time: "14:00"
        title: "The modelers respond: what do they actually want over the next two decades?"
        type: session
        description: >-
          Measurements: what, where, and how often? 20 minutes. Moderator: Al
          Hermann.
      - time: "14:20"
        title: "What can we learn from Arctic fisheries research (ACLIM)?"
        type: talk
        leads: [Kirstin Holsman]
      - time: "14:40"
        title: Coffee break
        type: break
        description: 30 minutes. Posters go up.
      - time: "15:10"
        title: "Digital twins in practice: ports and infrastructure"
        type: talk
        description: The benefits and limitations of digital twins.
        leads: [Shiori Sasaki, Esri]
      - time: "15:30"
        title: Why an Urban Sea System may require a Complex Adaptive Digital Twin ensemble to capture its full complexity
        type: talk
        description: Speaker to be announced.
      - time: "15:45"
        title: Digital twin approaches to complex systems and next-generation stewardship
        type: session
        description: Discussion. Moderator to be announced.
      - time: "16:00"
        title: "Open forum: comments welcome"
        type: working
        description: >-
          The graphic of a pristine and a modern Urban Sea System goes up on the
          large screen: which set of issues is yours?
        leads: [Anna Sulc, H. Gary Greene]
      - time: "17:00"
        title: "What happens on Days 2 and 3; breakout sign-up for the Day 2 focused sessions"
        type: plenary
        leads: [Kate Moran, Jeff Harris, John R. Delaney]
      - time: "17:15"
        title: Posters, conversation, and cash bar
        type: social
      - time: "18:30"
        title: Bar closes; dinner on your own
        type: social
        description: University Village is six blocks away.

  - id: day-2
    label: Day 2
    theme: Breakouts
    date: 2026-12-16
    summary: >-
      For invited participants. Day 2 builds the specification from two directions.
      The system lens asks how the region's models must connect. The user lens asks
      who will use the twin and what they need to know. The two meet in the
      afternoon's worked cascades. Each session runs in three spaces at once.
    sessions:
      - time: "08:30"
        title: Coffee; what the Day 1 couplings board tells us
        type: break
      - time: "08:45"
        title: "How today works: the system lens and the user lens"
        type: plenary
        leads: [John R. Delaney, Shiori Sasaki]
      - time: "09:00"
        title: "Round A: the seven modules, in three spaces"
        type: working
        description: >-
          The physical system: hydrodynamics and circulation, weather and climate,
          watersheds and runoff. The living and polluted system: ecological systems,
          pollution of air and water. The built and hazardous system: ports and
          supply chains, hazards. Each group corrects and extends a coupling table
          already filled in from the module summaries.
      - time: "10:15"
        title: Coffee
        type: break
      - time: "10:35"
        title: "Round A continues: finish the table and mark the three missing couplings that matter most"
        type: working
      - time: "11:25"
        title: Report-backs, five minutes per module
        type: plenary
      - time: "12:00"
        title: Lunch
        type: break
      - time: "12:45"
        title: "Round B: three cross-cutting groups"
        type: working
        description: >-
          Real-time sensing above sea level. Sub-sea measurement, from streams and
          estuaries out to the Pacific. Educational gaming and public use. Each group
          also names the people who would use its part of the twin.
      - time: "14:15"
        title: Coffee
        type: break
      - time: "14:45"
        title: Worked cascades, through the eyes of the people who must decide
        type: working
        description: >-
          A Rainier debris flow into the Nisqually valley, as a county emergency
          manager lives it. Watershed nutrients and a summer heat wave in southern
          Puget Sound, as a shellfish grower and a public health officer see it.
          Rising tanker traffic through Haro Strait, underwater noise, and the
          orcas, as a port operations manager and a whale researcher weigh it.
      - time: "16:00"
        title: Report-backs, ten minutes per cascade
        type: plenary
      - time: "16:30"
        title: The day's open questions, and what Day 3 must decide
        type: plenary
      - time: "17:00"
        title: Close
        type: break
      - time: "18:30"
        title: Hosted dinner for workshop participants
        type: social

  - id: day-3
    label: Day 3
    theme: Governance and what persists
    date: 2026-12-17
    summary: >-
      For invited participants. Day 3 turns the specification into decisions: who
      holds the twin, what to build first, and who will carry it. It ends with a
      joint statement. We close at 3:00 so people can travel.
    sessions:
      - time: "08:30"
        title: Coffee; the whole board on one screen
        type: plenary
        description: >-
          The seven modules' coupling tables, combined overnight into one map of the
          region's connections.
      - time: "09:00"
        title: Cross-border society and governance
        type: talk
        leads: [Natalie Baloy]
      - time: "09:30"
        title: Governance breakouts, one per space
        type: working
        description: >-
          Who hosts and who governs. Data: sharing, protection, and open formats.
          What persists: people, funding, and hosting after December.
      - time: "10:50"
        title: Coffee
        type: break
      - time: "11:10"
        title: Report-backs
        type: plenary
      - time: "11:40"
        title: Lunch
        type: break
      - time: "12:30"
        title: "Prioritize: impact against effort"
        type: working
        description: >-
          The room places candidate first projects on a two-by-two of impact and
          effort.
        leads: [Shiori Sasaki]
      - time: "13:30"
        title: The pilot and a phased roadmap, with owners
        type: working
        description: >-
          Choose one pilot for 2027, sketch the phases beyond it, and name a working
          group and its members.
      - time: "14:15"
        title: The joint statement
        type: plenary
        description: >-
          The conveners read a draft prepared from Days 1 and 2. The room amends it,
          and those willing sign.
        leads: [John R. Delaney, Kate Moran, H. Gary Greene]
      - time: "14:45"
        title: Closing words
        type: plenary
      - time: "15:00"
        title: Close
        type: break
