# ---------------------------------------------------------------------------
# Global site and event settings. Read by every page.
# Fields marked (md) accept Markdown. See docs/CONTENT_MODEL.md.
# ---------------------------------------------------------------------------
name: CADT Workshop 2026
short_name: CADT 2026
title: Complex Adaptive Digital Twins for Urban Sea Systems
tagline: A working meeting to design the first modules of a digital twin of the Salish Sea.
description: >-
  A three-day meeting in Seattle, 15 to 17 December 2026. Day 1 is open to all who
  register. Days 2 and 3 are a working meeting of invited participants, to test
  whether a complex adaptive digital twin can help steward the Salish Sea, and to
  scope its first seven modules.
url: https://maleenkidiwela.github.io/CADT_Workshop/
repo: https://github.com/mdenolle/CADT_workshop_2026
og_image: assets/img/figures/urban-sea-system.jpg

# Look of the site. classic: the original design (site.css alone).
# chart: nautical-chart restyle layered on top (assets/css/theme-chart.css).
theme: chart

event:
  start: 2026-12-15
  end: 2026-12-17
  dates_confirmed: true
  dates_note: Dates confirmed.
  timezone_label: Pacific Standard Time (UTC-8)
  countdown_iso: "2026-12-15T08:45:00-08:00"
  city: Seattle, Washington
  host: University of Washington
  format: In person, at the UW Center for Urban Horticulture
  attendance: Day 1 open to all who register. Days 2 and 3 for about 50 invited participants.

# One of the keys in status_labels.
status: registration_soon
status_labels:
  planning: Planning underway
  registration_soon: Day 1 registration opening soon
  registration: Day 1 registration open
  interest: Expressions of interest open
  invitations: Invitations sent
  full: Participation confirmed
  live: Happening now
  archived: Concluded

hero:
  eyebrow: Workshop · Seattle · December 2026
  heading: Complex Adaptive Digital Twins for Urban Sea Systems
  heading_accent: Urban Sea Systems
  lead: >-
    The Salish Sea is one coupled system of watersheds, cities, ports, and coastal
    ocean, shared by two nations. This working meeting brings together the people
    who model, observe, and govern it to design the first modules of a digital twin,
    and to decide what it would take to build one.
  figure: urban-sea-system
  # Optional timelapse: `before` is revealed into `figure` by a slider. `fit`
  # places the before image inside the figure's frame, in percent, so the two
  # block outlines line up (fitted by maximizing silhouette overlap).
  # `origin` is where the change spreads from (the harbor), in percent.
  compare:
    before: urban-sea-before
    before_label: Before the city
    after_label: Today
    fit: {left: -1.87, top: 0.14, width: 102.59, height: 101.74}
    origin: {x: 19, y: 40}

