foundations:
  kicker: What complex adaptive means
  heading: Federated, bounded, governed from within
  intro: >-
    Three ideas, taken in sequence, define the instrument the workshop sets out to
    build. Each one imposes a design obligation.
  items:
    - name: John Holland
      idea: Mechanism
      text: >-
        When many agents interact under local rules, system-level behavior emerges
        from the couplings and cannot be deduced from the parts.
      obligation: Federated build
      obligation_text: >-
        Couple many domain modules rather than perfect any one. The couplings are
        the object.
    - name: Simon Levin
      idea: Limit
      text: >-
        Ecosystems are the foremost complex adaptive systems, and their emergent
        behavior includes outcomes that no model will predict.
      obligation: Bounded futures
      obligation_text: >-
        Characterize the range of plausible outcomes and let decision-makers
        rehearse against them. Explore, do not forecast.
    - name: Elinor Ostrom
      idea: Remedy
      text: >-
        Communities can govern shared resources durably through their own evolving
        rules. The decision-makers belong inside the system.
      obligation: Governance inside
      obligation_text: >-
        The parties who must act on the system take part in the instrument that
        represents it. A module, not a user.
  figure: digital-twin-cycle

prototype:
  kicker: The prototype
  heading: Start with the Salish Sea
  body: >-
    The Salish Sea is a large, complex mountain-to-seafloor basin shared by the
    United States and Canada: the Strait of Juan de Fuca, the Strait of Georgia,
    and Puget Sound, fed by the Fraser and nine other major rivers, with Vancouver,
    Victoria, Seattle, Tacoma, and Olympia on its shores. Few coastal regions are
    as well observed or as densely modeled. Few are governed by as many
    jurisdictions. That combination makes it the right place to build a first
    Urban Sea digital twin, and to learn how the pattern could travel to systems
    at other stages of development.
  points:
    - title: Densely observed
      text: >-
        Cabled observatories, moorings, coastal radar, ferry-based sensors, and
        daily forecast models on both sides of the border.
    - title: Already coupled in places
      text: >-
        A US-run coastal forecast supplies daily boundary conditions to a Canadian
        operational model. The coupling fabric is not a hypothesis; parts of it run
        today.
    - title: Two nations, many jurisdictions
      text: >-
        Federal, state, provincial, tribal, First Nation, and municipal authorities
        share one ecosystem and one economy.
    - title: Start small, think big
      text: >-
        Seven modules where regional models and committed people already exist, and
        a clear view of the seams between them.
  figure: salish-sea-basin
