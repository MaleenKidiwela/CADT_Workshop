# ---------------------------------------------------------------------------
# Why the workshop exists, the key numbers, and the Salish Sea prototype.
# ---------------------------------------------------------------------------
kicker: Why host such a workshop?
heading: Urban Sea Systems are economic engines in a global trading market.
lead: >-
  They are abundant, and they are hot spots of pollution in both the atmosphere
  and the ocean. Urban Sea Systems are human-natural ecological enclaves that
  extend from mountain headwaters through rivers, estuaries, and port cities into
  the coastal ocean. More than five hundred of them line the world's coasts, and
  our global inventory lists 583. They enclose a large share of the human
  population; they organize much of the global economy; and they are governed in
  sectors that do not match the scales on which water, sediment, organisms, goods,
  and information actually flow.
body: >-
  A digital twin, in the sense used here, is not one model or one dashboard. It is a
  persistent, continuously updated set of domain models, each owned by the experts
  who already run it, coupled to live observations and to each other, with
  interfaces that decision-makers can use. The Salish Sea has five decades of
  observation, modeling, and institutional investment behind it. The workshop asks
  whether that foundation can be federated into a working prototype, and what a
  first build would require.

pillars:
  - icon: globe
    title: Urban Sea Systems
    text: >-
      Watershed, urban region, and adjacent sea form one system. Ports, cables,
      shipping lanes, and data centers make these regions the nodes of global trade
      and communication, and hot spots of pollution and risk.
  - icon: layers
    title: The governance mismatch
    text: >-
      Currents, rivers, and storms ignore borders. Land use, fisheries, water
      quality, transport, and emergency management are each managed well in
      isolation, and rarely together. Cumulative and cascading risks can fall
      through the gaps.
  - icon: twin
    title: Digital twins as infrastructure
    text: >-
      Shared, continuously updated representations of all interacting sub-systems
      and conditions let existing institutions easily visualize all important
      linkages they could not readily resolve before, pose "what if" questions, and
      cooperate interactively without waiting for governance to be redesigned.

