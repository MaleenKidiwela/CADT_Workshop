# ---------------------------------------------------------------------------
# Why the workshop exists, the key numbers, and the Salish Sea prototype.
# ---------------------------------------------------------------------------
kicker: Why this workshop
heading: Urban Sea Systems are coupled. Their governance is not.
lead: >-
  Urban Sea Systems run from mountain headwaters through rivers, estuaries, and
  port cities to the coastal ocean. More than five hundred of them line the world's
  coasts, and the global inventory lists 583. They hold a large share of the human population, organize much of the
  global economy, and are governed in pieces that do not match the scales on which
  water, sediment, organisms, goods, and information actually move.
body: >-
  A digital twin, in the sense used here, is not one model or one dashboard. It is a
  persistent, continuously updated set of domain models, each owned by the experts
  who already run it, coupled to live observations and to each other, with
  interfaces that decision-makers can use. The Salish Sea has five decades of
  observation, modeling, and institutional investment behind it. The workshop asks
  whether that foundation can be federated into a working prototype, and what a
  first build would require.

pillars:
  - icon: globe
    title: Urban Sea Systems
    text: >-
      Watershed, urban region, and adjacent sea form one system. Ports, cables,
      shipping lanes, and data centers make these regions the nodes of global trade
      and communication, and hot spots of pollution and risk.
  - icon: layers
    title: The governance mismatch
    text: >-
      Currents, rivers, and storms ignore borders. Land use, fisheries, water
      quality, transport, and emergency management are each managed well in
      isolation, and rarely together. Cumulative and cascading risks fall through
      the gaps.
  - icon: twin
    title: Digital twins as infrastructure
    text: >-
      Shared, continuously updated representations of system conditions let
      existing institutions see linkages they could not see before, test what-if
      questions, and coordinate without waiting for governance to be redesigned.

