# ---------------------------------------------------------------------------
# Day 1 registration page, rendered to register.html.
# The form sends each response into a Google Form held by the organizers, so
# responses collect in that form (and its linked Sheet). Setup:
# docs/REGISTRATION.md.
# Days 2 and 3 are by invitation; there is no registration for them.
# ---------------------------------------------------------------------------
title: Register for Day 1
kicker: Registration
description: >-
  Day 1 of the workshop is open to anyone who registers. Days 2 and 3 are by
  invitation.

# false: the page shows closed_text instead of the form.
open: true
closed_text: >-
  Registration for Day 1 is not open yet. Please check back soon.

# The Google Form's response address:
#   https://docs.google.com/forms/d/e/<form id>/formResponse
# While empty, the form shows but tells people it cannot send yet.
form_action: "https://docs.google.com/forms/d/e/1FAIpQLSd-WRIlKe746egl1fRJfM-OebsxuRjGAg6IVip6XJt-yAc3WA/formResponse"


intro: >-
  Day 1 sets out why Urban Seas matter, from hazards to the living sea, and gives
  the open audience a voice.

success: >-
  Thank you, you are registered for Day 1. Room details will be sent to
  registered participants before the workshop.

# Fields, in order. type: text | email | textarea | select | radio | checkbox.
# `entry` is the Google Form's id for the matching question (entry.123456789);
# docs/REGISTRATION.md says how to find them. The email field uses
# `emailAddress`, the form's own email field (Collect email addresses:
# Responder input), which lets Google send each registrant a copy. Options must match the Google
# Form's choices exactly. Quote "Yes" and "No" so YAML keeps them as text.
fields:
  - {name: name, entry: "entry.130951903", label: Full name, type: text, required: true, autocomplete: name}
  - {name: email, entry: emailAddress, label: Email, type: email, required: true, autocomplete: email}
  - {name: affiliation, entry: "entry.667162576", label: Affiliation or organization, type: text, required: true, autocomplete: organization}
  - {name: role, entry: "entry.14982402", label: Role or title, type: text, autocomplete: organization-title}
  - name: sector
    entry: "entry.1404982541"
    label: Sector
    type: select
    options: [Academic, Government, Tribal nation, Industry, Nonprofit, Student, Other]
  - {name: interest, entry: "entry.1123239878", label: "What is your interest in digital twins, and what would you like to take away from Day 1?", type: textarea}
  # The seven modules, as named in modules.yaml. `other` adds an "Other" box
  # with a text field; it needs "Add 'Other'" turned on for this question in
  # the Google Form, or Google drops the response.
  - name: modules
    entry: "entry.1927992237"
    label: Which parts of the Urban Sea System interest you most?
    hint: Choose any, and add your own under Other.
    type: checkbox
    other: "For example: funding, education, security, population health, politics"
    options:
      - Hydrodynamics and circulation
      - Weather and climate
      - Watersheds and runoff
      - Pollution of air and water
      - Ports and supply chains
      - Hazards, natural and human-generated
      - Ecological systems
  - {name: dietary, entry: "entry.408902379", label: Dietary needs, type: textarea, hint: For coffee and breaks.}
  - {name: accessibility, entry: "entry.1587676390", label: Accessibility needs, type: textarea}
  - name: recording_consent
    entry: "entry.298526181"
    label: Day 1 plenary sessions will be recorded. Do you consent to appearing in the recording?
    type: radio
    required: true
    options: ["Yes", "No"]
  - name: list_publicly
    entry: "entry.1718015660"
    label: May we list your name and affiliation as a participant?
    type: radio
    required: true
    options: ["Yes", "No"]
  - {name: notes, entry: "entry.1197572041", label: "Anything else we should know?", type: textarea}
